<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Multifuncional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calculadora">
  <div class="topo">
    <div class="icone">✦</div>
    <div><p class="eyebrow">CALCULADORA</p><h1>Multifuncional</h1></div>
  </div>
  <p class="subtitulo">Faça seus cálculos de forma rápida e simples.</p>

  <section class="entradas">
    <div class="campo"><label for="numero1">Número 1</label><input type="number" id="numero1" step="any" placeholder="0"></div>
    <div class="campo"><label for="numero2">Número 2</label><input type="number" id="numero2" step="any" placeholder="0"></div>
  </section>

  <div class="botoes">
    <button onclick="somar()"><span>＋</span> Somar</button>
    <button onclick="subtrair()"><span>−</span> Subtrair</button>
    <button onclick="multiplicar()"><span>×</span> Multiplicar</button>
    <button onclick="dividir()"><span>÷</span> Dividir</button>
    <button onclick="porcentagem()"><span>%</span> Porcentagem</button>
    <button onclick="adicionarVirgula()"><span>,</span> Vírgula</button>
    <button onclick="limpar()" class="btn-ce"><span>↺</span> Limpar tudo</button>
  </div>

  <section class="resultado-card"><p>RESULTADO</p><h2 id="resultado">Resultado:</h2></section>
  <footer>Calculadora Multifuncional</footer>
</main>
<script src="script.js"></script>
</body>
</html>
